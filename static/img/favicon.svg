<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="primeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#primeGrad)" stroke-width="2.5" />

  <!-- Glow effect -->
  <g filter="url(#glow)">
    <!-- Electric Lightning Bolt (PTM Prime) -->
    <path d="M35 8 L18 34 L31 34 L25 56 L46 28 L33 28 Z" fill="url(#primeGrad)" />
  </g>

  <!-- Sharp Inner Core -->
  <path d="M35 8 L18 34 L31 34 L25 56 L46 28 L33 28 Z" fill="#ffffff" opacity="0.3" />
  <path d="M35 12 L22 33 L32 33 L28 50 L42 29 L33 29 Z" fill="url(#primeGrad)" />
</svg>
